<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface: #ffffff; --page: #f7f8fa; --ink: #1b2733; --ink-2: #4d5a66; --muted: #8a93a0;
    --hairline: #e3e6ea; --border: rgba(27,39,51,0.12);
    --accent: #1c5cab; --good: #0ca30c; --warn: #b97900; --bad: #d03b3b; --seal: #d03b3b;
    --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    --font-body: system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --font-data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1b1e23; --page: #121417; --ink: #e9ebee; --ink-2: #b6bcc4; --muted: #7f8792;
      --hairline: #2a2e35; --border: rgba(233,235,238,0.14);
      --accent: #5598e7; --warn: #fab219; --seal: #e05252;
    }
  }
  body {
    width: 300px; margin: 0; padding: 14px 16px 16px;
    font: 13px/1.6 var(--font-body);
    background: var(--surface); color: var(--ink);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .seal {
    width: 30px; height: 30px; flex: none; display: grid; place-items: center;
    font: 700 17px/1 var(--font-display);
    color: var(--seal); border: 2px solid var(--seal); border-radius: 4px;
    transform: rotate(-3deg);
  }
  h1 { font: 600 15px/1.2 var(--font-display); letter-spacing: 0.04em; margin: 0; }
  #title { color: var(--ink-2); word-break: break-all; margin: 0 0 10px;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #status {
    margin: 0 0 12px; padding: 8px 10px;
    background: var(--page); border: 1px solid var(--hairline); border-radius: 4px;
  }
  .job { display: flex; justify-content: space-between; padding: 2px 0; }
  .job .st { font-weight: 600; font-variant-numeric: tabular-nums; }
  .st-pending { color: var(--accent); }
  .st-processing { color: var(--warn); }
  .st-done { color: var(--good); }
  .st-failed { color: var(--bad); }
  .st-ignored { color: var(--muted); }
  button {
    width: 100%; padding: 7px 0; border: 1px solid var(--accent); border-radius: 4px;
    background: var(--accent); color: #fff; font: 13px/1.5 var(--font-body); cursor: pointer;
  }
  button:disabled { background: var(--muted); border-color: var(--muted); cursor: default; }
  button + button { margin-top: 8px; }
  button.secondary { background: var(--surface); color: var(--accent); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { display: block; margin-top: 10px; color: var(--accent); text-decoration: none; text-align: center; }
</style>
</head>
<body>
  <div class="brand">
    <span class="seal" aria-hidden="true">收</span>
    <h1>Info Collector</h1>
  </div>
  <p id="title"></p>
  <div id="status">加载中…</div>
  <button id="save" hidden>保存到队列</button>
  <button id="save-podcast" class="secondary" hidden>保存为播客</button>
  <a href="#" id="dashboard">打开 Dashboard →</a>
  <script src="popup.js" type="module"></script>
</body>
</html>
